name: Build Valkey JSON Debian Package

on:
  push:
    branches: [1.0]
  pull_request:
    branches: [1.0]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgtest-dev \
            ninja-build \
            libssl-dev \
            pkg-config \
            fakeroot \
            devscripts \
            dh-make \
            clang \
            clangd \
            clang-tidy \
            clang-format

      - name: Set up build directory
        run: |
          mkdir -p build
          cd build
          cmake .. -DVALKEY_VERSION=8.0
          make -j$(nproc)

      - name: Package into .deb
        run: |
          mkdir -p deb_package/usr/lib/valkey
          cp build/src/libjson.so deb_package/usr/lib/valkey/
          mkdir -p deb_package/DEBIAN
          cat <<EOF > deb_package/DEBIAN/control
          Package: valkey-json
          Version: 1.0.0
          Section: libs
          Priority: optional
          Architecture: amd64
          Maintainer: Your Name <you@example.com>
          Description: Valkey JSON module
           A C++ Valkey module that provides native JSON support.
          EOF
          dpkg-deb --build deb_package valkey-json_1.0.0_amd64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v3
        with:
          name: valkey-json-deb
          path: valkey-json_1.0.0_amd64.deb
