name: Build Valkey JSON Debian Package

on:
  push:
    branches:
      - 'unstable'
      - 'installability_check'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '1.0'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 #v3.1.4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgtest-dev \
            ninja-build \
            libssl-dev \
            pkg-config \
            fakeroot \
            devscripts \
            dh-make \
            clang \
            clangd \
            clang-tidy \
            #            clang-format \
      - name: Set up build directory
        run: |
          ./build.sh
          #mkdir -p build
          #cd build
          #cmake .. -DVALKEY_VERSION=8.0 -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          #make -j$(nproc) VERBOSE=1

      - name: Package into .deb
        run: |
          mkdir -p deb_package/usr/lib/valkey
          cp build/src/libjson.so deb_package/usr/lib/valkey/
          mkdir -p deb_package/DEBIAN
          cat <<EOF > deb_package/DEBIAN/control
          Package: valkey-json
          Version: 1.0.0
          Section: libs
          Priority: optional
          Architecture: amd64
          Maintainer: Your Name <you@example.com>
          Description: Valkey JSON module
           A C++ Valkey module that provides native JSON support.
          EOF
          dpkg-deb --build deb_package valkey-json_1.0.0_amd64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: valkey-json-deb
          path: valkey-json_1.0.0_amd64.deb
  verify-install:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: valkey-json-deb

      - name: Install package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./valkey-json_1.0.0_amd64.deb

      - name: Verify installation
        run: |
          echo "Checking package installation status:"
          if dpkg -l valkey-json | grep -q "^ii"; then
            echo "Package valkey-json is successfully installed"
          else
            echo "Package not properly installed in dpkg database"
            dpkg -l | grep valkey
            exit 1
          fi

          echo "Checking for library file:"
          if [ -f "/usr/lib/valkey/libjson.so" ]; then
            echo "Library file exists at expected location"
            ls -la /usr/lib/valkey/libjson.so
          else
            echo "Library file not found at expected location"
            exit 1
          fi
