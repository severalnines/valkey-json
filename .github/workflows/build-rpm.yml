name: Build Valkey JSON RPM Package

on:
  push:
    branches:
      - 'unstable'
      - 'build_tag'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '1.0'
      - 'unstable'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          else
            echo "VERSION=1.0.0" >> $GITHUB_ENV
          fi
          echo "Package version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 #v3.1.4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgtest-dev \
            ninja-build \
            libssl-dev \
            pkg-config \
            clang \
            clangd \
            clang-tidy \
            rpm 

      - name: Set up build directory
        run: |
          ./build.sh

      - name: Setup RPM build environment
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp valkey-json.spec ~/rpmbuild/SPECS/
          sed -i "s/Version: .*/Version: ${{ env.VERSION }}/" ~/rpmbuild/SPECS/valkey-json.spec

      - name: Prepare RPM build source
        run: |
          cp build/src/libjson.so ~/rpmbuild/SOURCES/

      - name: Build RPM package
        run: |
          rpmbuild -bb ~/rpmbuild/SPECS/valkey-json.spec

      - name: Move RPM to workspace
        run: |
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} valkey-json-${{ env.VERSION }}.rpm \;

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: valkey-json-rpm
          path: valkey-json-${{ env.VERSION }}.rpm
  verify-install:
    needs: build
    runs-on: ubuntu-22.04
    container: rockylinux:9

    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          else
            echo "VERSION=1.0.0" >> $GITHUB_ENV
          fi
          echo "Package version: $VERSION"

      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: valkey-json-rpm

      - name: Install package
        run: |
          dnf install -y ./valkey-json-${{ env.VERSION }}.rpm

      - name: Verify installation
        run: |
          echo "Checking package installation status:"
          if rpm -q valkey-json; then
            echo "Package valkey-json is successfully installed"
          else
            echo "Package not properly installed in RPM database"
            rpm -qa | grep valkey
            exit 1
          fi

          echo "Checking for library file:"
          if [ -f "/usr/lib/valkey/libjson.so" ]; then
            echo "Library file exists at expected location"
            ls -la /usr/lib/valkey/libjson.so
          else
            echo "Library file not found at expected location"
            exit 1
          fi